{% extends 'registration/base.html' %}

{% block content %}
{% if validlink %}
<div class="card-body login-card-body">
  <p class="login-box-msg"><strong>Change Password</strong></p>



  <form method="post"> <!-- Changed to url template tag -->
    {% csrf_token %}
    {% for field in form %}
      <div class="form-group">
        {{ field.errors }}
        {{ field.label_tag }}
        <input type="password" id="{{ field.id_for_label }}" class="form-control" name="{{ field.html_name }}" required>
      </div>
    {% endfor %}
    <button type="submit" class="btn btn-block btn-success">Change Password</button>
  </form>
</div>
{% else %}
<p>
  The Password Link Was Expired or Invalid.
</p>
{% endif %}
{% endblock content %}
