{% load static %}
<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Student Management System | Log in</title>
  <!-- Tell the browser to be responsive to screen width -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="{% static 'plugins/fontawesome-free/css/all.min.css' %}">
  <!-- Ionicons -->
  <link rel="stylesheet" href="https://code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css">
  <!-- icheck bootstrap -->
  <link rel="stylesheet" href="{% static 'plugins/icheck-bootstrap/icheck-bootstrap.min.css' %}">
  <!-- Theme style -->
  <link rel="stylesheet" href="{% static 'dist/css/adminlte.min.css' %}">
  <!-- Google Font: Source Sans Pro -->
  <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700" rel="stylesheet">

  <style>
    .login-card-body,
    .register-card-body {
      background: #fff !important;
      border-top: 0;
      color: #666;
      padding: 20px;
      border-radius: 20%;
    }

    .text-center {
      padding-top: 10px !important;
    }

    .text-center a {
      color: #33a1e0 !important;
    }

    .text-center a:hover {
      color: #1c6ea4 !important;
      font-weight: bold;
    }
    
    .password-toggle {
      cursor: pointer;
      background: transparent;
      color: #777;
      border: none;
      outline: none !important;
      padding: 0 5px;
      float: right;
    }

  /* .password-toggle:focus {
    outline: none !important;
    box-shadow: none !important;
  } */
    
    #toggleIcon {
      display: none;
    }
    
    .input-group.has-value #toggleIcon {
      display: inline-block;
    }
    
    .input-group.has-value .fa-lock {
      display: none;
    }
  </style>
</head>

<body class="hold-transition login-page">
  <div class="login-box">
    <div class="login-logo">
      <a href="../../index2.html"><b>Student</b>Management System</a>
    </div>
    <!-- /.login-logo -->
    <div class="card">
      <div class="card-body login-card-body">
        <p class="login-box-msg">Sign in to Student Management System</p>

        <form action="{% url 'do_login' %}" method="post">
          {% csrf_token %}
          <div class="input-group mb-3">
            <input type="email" class="form-control" placeholder="Email" name="email" required>
            <div class="input-group-append">
              <div class="input-group-text">
                <span class="fas fa-envelope"></span>
              </div>
            </div>
          </div>
          <div class="input-group mb-3" id="passwordGroup">
            <input type="password" class="form-control" id="password" placeholder="Password" name="password" required>
            <div class="input-group-append">
              <div class="input-group-text">
                <button type="button" class="password-toggle" onclick="togglePassword()">
                  <i class="fas fa-eye" id="toggleIcon"></i>
                </button>
                <span class="fas fa-lock"></span>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-12">
              <button type="submit" class="btn btn-primary btn-block">Sign In</button>
            </div>
            <div class="col-12 text-center">
              <a href="{% url 'password_reset' %}">Reset Password</a>
            </div>
          </div>
        </form>
      </div>
      <!-- /.login-card-body -->
    </div>
  </div>
  <!-- /.login-box -->

  <!-- jQuery -->
  <script src="{% static 'plugins/jquery/jquery.min.js' %}"></script>
  <!-- Bootstrap 4 -->
  <script src="{% static 'plugins/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
  <!-- AdminLTE App -->
  <script src="{% static 'dist/js/adminlte.min.js' %}"></script>

  <script>
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const toggleIcon = document.getElementById('toggleIcon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.classList.remove('fa-eye');
        toggleIcon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        toggleIcon.classList.remove('fa-eye-slash');
        toggleIcon.classList.add('fa-eye');
      }
    }

    document.getElementById('password').addEventListener('input', function(e) {
      const passwordGroup = document.getElementById('passwordGroup');
      if (this.value.length > 0) {
        passwordGroup.classList.add('has-value');
      } else {
        passwordGroup.classList.remove('has-value');
      }
    });
  </script>

</body>
</html>
